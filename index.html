<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>File Token Counter</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="container">
    <h1>File Token Counter</h1>
    <p class="subtitle">Upload Markdown, HTML, TXT, or XLSX files and estimate their GPT token usage.</p>

    <section class="card">
      <label for="file-input" class="label">Choose file</label>
      <input id="file-input" type="file" accept=".md,.markdown,.html,.htm,.txt,.xlsx" />

      <label for="model-select" class="label">Tokenizer model</label>
      <select id="model-select">
        <option value="gpt-4o">gpt-4o</option>
        <option value="gpt-4.1-mini">gpt-4.1-mini</option>
        <option value="gpt-3.5-turbo">gpt-3.5-turbo</option>
      </select>

      <button id="count-btn">Count tokens</button>
      <p id="status" class="status"></p>
    </section>

    <section id="result" class="card hidden" aria-live="polite">
      <h2>Result</h2>
      <ul>
        <li><strong>File:</strong> <span id="result-name"></span></li>
        <li><strong>Type:</strong> <span id="result-type"></span></li>
        <li><strong>Characters:</strong> <span id="result-chars"></span></li>
        <li><strong>Estimated tokens:</strong> <span id="result-tokens"></span></li>
      </ul>
    </section>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
